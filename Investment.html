function selectedDateDsoTotals(legacy,ledger,selectedDate){
 const reports=new Map();
 for(const [key,report] of Object.entries(legacy||{})){
  if(report?.date===selectedDate && /^(80[1-9]|8[1-3][0-9]|84[0-5])$/.test(String(report.userId||'')))reports.set(String(report.userId),report);
 }
 for(const account of Object.values(ledger||{})){
  if(account?.date!==selectedDate)continue;
  const uid=String(account.userId||account.report?.userId||'');
  if(!/^(80[1-9]|8[1-3][0-9]|84[0-5])$/.test(uid))continue;
  // Canonical migration data replaces the archived legacy report, including deletion.
  reports.delete(uid);
  if(account.report)reports.set(uid,account.report);
 }
 const moneyValue=value=>{const n=Number(String(value??0).replace(/,/g,''));if(!Number.isFinite(n))throw Error('DSO B2B amount সঠিক নয়।');return Math.round(n*100);};
 let received=0,sent=0,cashIssued=0;for(const report of reports.values()){received+=moneyValue(report.emReturn);sent+=moneyValue(report.emReceived);cashIssued+=moneyValue(report.cashReceived);}
 const teams={Sadar:['801','802','803','804','806','808','809','811','812','813','814','815'],Saturia:['805','807','816','817','818','819','820','821','822','823'],Singair:['810','835','836','837','838','839','840','841','842','843','844','845'],Shivalaya:['824','825','826','827','828','829','830','831','832','833','834']};
 const marketCash=Object.fromEntries(Object.entries(teams).map(([team,ids])=>[team,ids.reduce((sum,id)=>sum+moneyValue(reports.get(id)?.cashReturn??reports.get(id)?.cashDeposit),0)/100]));
 const bankDeposits=[];for(const report of reports.values()){const slips=report.bankSlips||report.slips; if(Array.isArray(slips)&&slips.length){for(const slip of slips){if(slip.status==='rejected')continue;bankDeposits.push({bankName:slip.bankName||report.bankName,amount:moneyValue(slip.amt??slip.amount)/100});}}else if(Number(report.bankDeposit)>0)bankDeposits.push({bankName:report.bankName,amount:moneyValue(report.bankDeposit)/100});}
 return {receive:received/100,send:sent/100,count:reports.size,cashIssueDso:cashIssued/100,marketCash,bankDeposits};
}

window.headOfficeReportRows=function(entries){
 const list=rows=>Array.isArray(rows)?rows:rows&&typeof rows==='object'?[rows]:[];
 const result=[];
 for(const [key,record]of Object.entries(entries||{})){
  if(record?.scope!=='company'||!/^\d{4}-\d{2}-\d{2}$/.test(record.date||''))continue;
  const add=(row,direction,source,index)=>{const amount=Number(String(row?.amount??'').replace(/,/g,''));if(!Number.isFinite(amount)||amount<=0)return;
   const type=row.balanceType||(row.via==='bank'?'bank':'cash');if(!['cash','bank'].includes(type)||!['received','transfer'].includes(direction))return;
   result.push({key:key+':'+direction+':'+index,date:record.date,direction,type,bankName:type==='bank'?String(row.bankName||''):'',personName:type==='cash'?String(row.personName||''):'',amount:Math.round(amount*100)/100,details:String(row.note||row.details||''),source,sourceRecord:record});};
  if(record.type==='calculator')list(record.cashCalculation?.headOfficeMovements).forEach((row,i)=>add(row,row.direction,'Working Balance Calculator',i));
 }
 return result.sort((a,b)=>b.date.localeCompare(a.date)||a.key.localeCompare(b.key));
};
