name: Responsive layout checks
# Recheck compact calendar fields after layout refinement.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-responsive-layout.yml'
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-responsive-layout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-layout-screenshots
          path: responsive-checks/
          retention-days: 7
