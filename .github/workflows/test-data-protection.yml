name: Test financial data protection
on:
  push:
    paths: ['.github/workflows/test-data-protection.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --package-lock=false firebase-tools@14.15.2 @firebase/rules-unit-testing@4.0.1 firebase@11.10.0
      - name: Prepare isolated Rules copy
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/prepare-protection-test.cjs
      - name: Test financial edits and deletion rejection
        run: npx firebase emulators:exec --project demo-hisab360-protection --config firebase.protection-test.json --only database 'node scripts/test-protection-emulator.cjs'
      - uses: actions/upload-artifact@v4
        with:
          name: Data-protection-test-result
          path: ${{ runner.temp }}/protection-test-result.json
          retention-days: 7
